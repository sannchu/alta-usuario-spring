<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{inicio.titulo}">Bienvenido</title>
    <!-- th:href="@{...}" añade el context path automáticamente (antes: ${pageContext.request.contextPath}) -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="oscuro">
<div class="card">
    <h1 th:text="#{inicio.pregunta}">¿Quieres darte de alta en la aplicación?</h1>
    <p th:text="#{inicio.descripcion}">Regístrate en unos segundos y cuéntanos qué tecnología te interesa más.</p>
    <!-- Un enlace siempre es GET -> @GetMapping("/alta") -->
    <a class="boton" th:href="@{/alta}" th:text="#{inicio.boton}">Darme de alta</a>
</div>
</body>
</html>
